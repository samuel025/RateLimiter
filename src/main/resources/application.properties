spring.application.name=RateLimiter
server.port=8091

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5439/ratelimiter}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gateway}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gateway}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

jwt.secret=Tf8FelYUyOfv2fmd+NQ5GbwI2BLOi4c9cs7e0MUWKbk=

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6375}

spring.threads.virtual.enabled=true

gateway.upstream.base-url=https://httpbin.org
gateway.upstream.health-path=/get

gateway.proxy.retry.max-attempts-idempotent=3
gateway.proxy.retry.backoff-millis=150

gateway.proxy.circuit-breaker.failure-threshold=5
gateway.proxy.circuit-breaker.open-seconds=30

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
